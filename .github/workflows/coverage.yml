# Coverage probe. Deploy-free by construction: it exists to
# MEASURE coverage on the Contabo runner, because coverage cannot be run on a
# developer machine here and the Mac Mini gate is frequently offline.
name: Coverage

# Also runs on push to main: this repo's default branch is `develop`, and
# workflow_dispatch only registers workflows that exist on the default branch,
# so dispatch is unavailable here until develop catches up. A push trigger is
# the only way to measure coverage on main today.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: [self-hosted, contabo]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Coverage (scoped to the task/project sync surfaces)
        run: |
          set -o pipefail
          npx vitest run --coverage \
            --coverage.include='src/pages/components/TaskModal.tsx' \
            --coverage.include='src/pages/TaskDetailPage.tsx' \
            --coverage.reporter=text \
            src/pages/components/TaskModal.bdd.test.tsx \
            src/pages/components/TaskModal.test.tsx \
            src/pages/TaskDetailPage.bdd.test.tsx \
            src/pages/TaskDetailPage.test.tsx 2>&1 | tee coverage.log || true

      - name: Report
        if: always()
        run: |
          grep -aE 'TaskModal|TaskDetailPage|All files|Test Files|Tests ' coverage.log | head -20
