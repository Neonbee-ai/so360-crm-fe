name: Deploy CRM Frontend to Production (neonbee.app)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}

    - name: Deploy to Production
      env:
        SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
        MODULE_PATH: crm
        BUILD_DIR: /github/SO360 V.2/so360-crm/so360-crm-fe
        NGINX_ROOT: /var/www/cdn.neonbee.app/html/crm
      run: |
        ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
        ssh root@$SERVER_IP "mkdir -p '$BUILD_DIR'"
        rsync -avz --delete --exclude 'node_modules' --exclude 'dist' --exclude '.git' ./ "root@$SERVER_IP:$BUILD_DIR/"
        ssh root@$SERVER_IP "BUILD_DIR='$BUILD_DIR' MODULE_PATH='$MODULE_PATH' NGINX_ROOT='$NGINX_ROOT' bash -s" << 'DEPLOY_SCRIPT'
          set -e
          cd "${BUILD_DIR}"
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22
          ln -sfn "/github/SO360 V.2/so360-shell-fe" "$(dirname "${BUILD_DIR}")/so360-shell-fe" 2>/dev/null || true
          npm install --legacy-peer-deps
          export VITE_BASE_URL=https://cdn.neonbee.app/${MODULE_PATH}/
          export VITE_SO360_CORE_API=https://api.neonbee.app/core
          export VITE_SO360_CRM_API=https://api.neonbee.app/crm
          npm run build
          mkdir -p "${NGINX_ROOT}"
          cp -r dist/* "${NGINX_ROOT}/"
          # ── Always enforce cdn.neonbee.app NGINX CORS config ──
          cat > "/etc/nginx/sites-available/cdn.neonbee.app" << NGINX_BLOCK
server {
    listen 80;
    server_name cdn.neonbee.app;
    root /var/www/cdn.neonbee.app/html;
    index index.html;

    access_log /var/log/nginx/cdn.neonbee.app-access.log;
    error_log /var/log/nginx/cdn.neonbee.app-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    location ~* /assets/remoteEntry\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        try_files \$uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        try_files \$uri =404;
    }

    location / {
        try_files \$uri \$uri/ /index.html;
    }
}
NGINX_BLOCK
          ln -sfn "/etc/nginx/sites-available/cdn.neonbee.app" "/etc/nginx/sites-enabled/cdn.neonbee.app"
          nginx -t && systemctl reload nginx
          echo "✅ NGINX CORS config enforced for cdn.neonbee.app"
          echo "✅ Deployed CRM to https://cdn.neonbee.app/${MODULE_PATH}/"
        DEPLOY_SCRIPT

    - name: Purge Cloudflare Cache
      if: always()
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_NEONBEE }}
      run: |
        if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
          echo "⚠️  CF credentials not set — skipping cache purge"
          exit 0
        fi
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
        echo "✅ Cloudflare cache purged"

    - name: Deployment Summary
      if: always()
      run: |
        echo "========================================="
        echo "Environment: Production"
        echo "CDN: https://cdn.neonbee.app/crm/"
        echo "========================================="
